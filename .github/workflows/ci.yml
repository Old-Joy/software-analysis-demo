name: Python CI/CD Pipeline

# 触发条件：当推送代码到主分支或特性分支，或者提交 PR 时触发
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 虚拟服务器上运行

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # 指定 Python 版本

    - name: 3. 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 运行单元测试
      run: |
        pytest test_app.py

    - name: 5. 模拟自动化部署
      if: success() # 只有前面的测试通过了，才会执行这一步
      run: |
        echo "🎉 测试全部通过！"
        echo "🚀 正在将应用部署到生产环境服务器..."
        echo "✅ 部署成功！"
